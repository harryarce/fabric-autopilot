name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build deps for pyodbc
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install package (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [api, mcp, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}
          push: false
          tags: fabric-saas-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
