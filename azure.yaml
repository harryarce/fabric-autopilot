# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Azure Developer CLI (azd) manifest.
#
# Three containerized services deployed to Azure Container Apps:
#   - api : FastAPI backend (internal ingress)
#   - mcp : agent-facing MCP server (internal ingress)
#   - web : Streamlit frontend (external ingress)
#
# Provision + deploy:  azd up
name: fabric-autopilot
metadata:
  template: fabric-autopilot@0.1.0

services:
  api:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile.api
      context: .

  mcp:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile.mcp
      context: .

  web:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile.web
      context: .
